services:
  silo-barracks-db:
    image: postgres:18-alpine
    container_name: silo-barracks-db
    restart: unless-stopped
    shm_size: "1gb"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: silo_barracks
    # Postgres 18 uses PGDATA=/var/lib/postgresql/18/docker.
    # Fresh installs only: dump/restore before reusing data from another major version.
    volumes:
      - barracks-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --dbname=silo_barracks --username=postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  silo-barracks:
    build: .
    image: silo-barracks:local
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_IP: silo-barracks-db
      POSTGRES_PORT: 5432
      POSTGRES_DB: silo_barracks
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      MEDIA_SERVER_PROVIDER: silo
      SILO_URL: ${SILO_URL:-}
      SILO_API_KEY: ${SILO_API_KEY:-}
      SILO_POLL_INTERVAL_MS: ${SILO_POLL_INTERVAL_MS:-5000}
      SILO_MIN_REQUEST_INTERVAL_MS: ${SILO_MIN_REQUEST_INTERVAL_MS:-150}
      SILO_DEFAULT_RATE_LIMIT_RETRY_MS: ${SILO_DEFAULT_RATE_LIMIT_RETRY_MS:-10000}
      SILO_MAX_RATE_LIMIT_RETRIES: ${SILO_MAX_RATE_LIMIT_RETRIES:-3}
      TZ: America/New_York
      CONFIG_DIR: /app/config
      BACKUP_DIR: /app/backups
      # Optional first-run bootstrap (uncomment to skip the setup wizard):
      # JF_HOST: https://jellyfin.example.com
      # JF_API_KEY: your-jellyfin-api-key
      # JS_AUTH_MODE: local
      # JS_USER: admin
      # JS_PASSWORD: choose-a-strong-password
      # JS_SKIP_FIRST_RUN: "true"
      # JS_AUTO_START_SYNC: "true"
    volumes:
      - barracks-config:/app/config
      - barracks-backups:/app/backups
    ports:
      - "3000:3000"
    depends_on:
      silo-barracks-db:
        condition: service_healthy

volumes:
  barracks-postgres:
  barracks-config:
  barracks-backups:
